[package]
name = "pdfcraft-cli"
description = "PdfCraft command-line tool: inspect, render and robustness-check PDFs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "pdfcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
pdfcraft-render = { workspace = true }
serde_json = { workspace = true }
pdfcraft-engine = { workspace = true }
pdfcraft-audit = { workspace = true }
pdfcraft-cos = { workspace = true }
pdfcraft-preflight = { workspace = true }
pdfcraft-automation = { workspace = true }
pdfcraft-platform = { workspace = true }
base64 = "0.23"

[dev-dependencies]
# Decodes `render` output in tests/it/owner_password.rs.
craft-image-codecs = { workspace = true }
# A private scratch folder for the fork's audit test (tests/it/audit/fork_tests.rs).
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
# `geteuid` for `ui`'s control-file owner check: safe, so no `unsafe` libc call here.
# Already in Cargo.lock through the GUI crates.
rustix = { version = "1", features = ["process"] }

[build-dependencies]
# VERSIONINFO for pdfcraft-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[features]
default = ["mcp"]
# The opt-in MCP server (`pdfcraft-cli mcp`). Build with --no-default-features to leave it out.
mcp = ["pdfcraft-automation/mcp"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/pdfcraft-cli-{ version }-linux-{ target-arch }.tar.gz"
bin-dir = "pdfcraft-cli-{ version }-linux-{ target-arch }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/pdfcraft-cli-{ version }-linux-x86_64.tar.gz"
