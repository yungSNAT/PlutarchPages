[package]
name = "pdfcraft-cos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Detached from the PdfCraft workspace: run with `cargo +nightly fuzz run indirect`
# from crates/cos/.
[workspace]

# A detached workspace skips the root [patch.crates-io], so repeat the vendored
# crate this target reaches through pdfcraft-filters.
[patch.crates-io]
hayro-jbig2 = { path = "../../../vendor/hayro-jbig2" }

# The root [patch] that swaps in the vendored, patched craft-pdf does not reach a detached
# workspace either (vendor/craft-pdf/PATCHES.md).
[patch."https://github.com/storytold/craft-libs"]
craft-pdf = { path = "../../../vendor/craft-pdf" }

[dependencies]
libfuzzer-sys = "0.4"
pdfcraft-cos = { path = ".." }

[[bin]]
name = "indirect"
path = "fuzz_targets/indirect.rs"
test = false
doc = false
bench = false
