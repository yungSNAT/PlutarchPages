[package]
name = "pdfcraft-cos-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Detached from the PdfCraft workspace: run with `cargo +nightly fuzz run indirect`
# from crates/cos/.
[workspace]

# A detached workspace skips the root [patch.crates-io], so repeat the vendored
# crate this target reaches through pdfcraft-filters.
[patch.crates-io]
hayro-jbig2 = { path = "../../../vendor/hayro-jbig2" }

[dependencies]
libfuzzer-sys = "0.4"
pdfcraft-cos = { path = ".." }

[[bin]]
name = "indirect"
path = "fuzz_targets/indirect.rs"
test = false
doc = false
bench = false
