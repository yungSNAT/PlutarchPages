version: 2
updates:
  # Maintain Rust / Cargo dependencies
  - package-ecosystem: "cargo"
    directories:
      - "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    # A release is not proposed until it is 7 days old, so a bad or compromised one has time to be
    # found and yanked. Security updates are not delayed.
    cooldown:
      default-days: 7
    # pdfcraft-fonts shapes with the skrifa and harfrust that egui's epaint uses, on one read-fonts:
    # a newer skrifa or harfrust on its own doesn't build. Move them by hand when egui does.
    ignore:
      - dependency-name: "skrifa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "harfrust"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Consolidate updates into a single PR rather than one PR per crate
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "America/New_York"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci(deps)"
