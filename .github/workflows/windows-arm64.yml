# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

# Pushes to main take the pull request's paths (PATCHES.md): release.yml builds the same package,
# and the weekly run catches drift.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "47 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  # Only pull request runs are cancelled: scheduled and push runs on main would
  # otherwise cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  windows-arm64:
    # Pinned: a mutable reference to another repository can change what CI runs. Move it deliberately.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@2b3fb9dc05036f73c77d18f753a3aa9da55fa386 # main, 31 October 2026
    with:
      app-name: pdfcraft
      app-dir: PlutarchPages
      install-relative-path: Programs/PlutarchPages
      install-scope: perUser
