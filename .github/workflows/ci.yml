name: CI

# Quality gates for every push to main and every pull request (`cargo xtask ci`), through the
# suite's shared gate workflow in craft-common-actions. Nightly fuzzing is in fuzz.yml.
on:
  push:
    branches: [main]
  pull_request:
    # `labeled` so that adding `full-ci` to an open PR starts a run with Windows in it.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# The token is only used to check out the code: no job writes to the repository.
permissions:
  contents: read

# A newer push to a PR branch cancels its older run; every push to main runs to the end. Adding
# any label but `full-ci` gets a group of its own, so it neither runs the gate nor cancels a run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a push to main changed only Markdown that no build or test reads. Such a push skips the
  # gate's Windows leg and the coverage job. The gate's Linux leg, which runs every test and
  # repository check, still runs, so release.yml still finds a passing run for the commit. vendor/
  # is not docs: a test reads vendor/README.md and lopdf's README is its crate documentation. Nor
  # is ATTRIBUTION.md, which `cargo xtask assets` checks.
  changes:
    if: github.event_name == 'push'
    name: Docs-only push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          # Every changed path, a rename's old one included, is Markdown outside vendor/.
          DOCS_ONLY: >-
            [.files[] | .filename, (.previous_filename // empty)] as $f
            | ($f | length) > 0 and ($f | length) < 300
            and ($f | all(endswith(".md") and (startswith("vendor/") | not) and . != "ATTRIBUTION.md"))
        # Anything unexpected (a new branch, an API error, 300 files or more) counts as code.
        run: |
          docs_only=false
          if result=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$GITHUB_SHA" --jq "$DOCS_ONLY"); then
            docs_only=$result
          fi
          echo "docs_only=$docs_only" | tee -a "$GITHUB_OUTPUT"

  # The shared gate doesn't check where git dependencies come from; release.yml runs the same job.
  git-sources:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    name: Git dependencies come from storytold
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows font notice regressions
        shell: pwsh
        run: ./packaging/windows/test-font-notices.ps1
      - name: Git dependencies come from storytold
        run: |
          set -euo pipefail
          test -f Cargo.lock || { echo "Cargo.lock is missing"; exit 1; }
          # Source replacement, patches and path overrides in cargo config never show up
          # in Cargo.lock. Parsed rather than grepped: TOML has many spellings of one key.
          # Cargo still reads the legacy .cargo/config.
          python3 - <<'PY'
          import os, sys, tomllib
          for path in (".cargo/config", ".cargo/config.toml"):
              if not os.path.exists(path):
                  continue
              config = tomllib.load(open(path, "rb"))
              replaced = [name for name, source in config.get("source", {}).items()
                          if isinstance(source, dict) and "replace-with" in source]
              if replaced or "patch" in config or "paths" in config:
                  print(f"{path} replaces, patches or overrides a source")
                  sys.exit(1)
          PY
          # Fails when Cargo.lock is out of date with the manifests.
          cargo metadata --locked --format-version 1 > /dev/null
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open("Cargo.lock", "rb"))
          bad = sorted({p["source"] for p in lock.get("package", [])
                        if p.get("source", "").startswith("git+")
                        and not p["source"].startswith("git+https://github.com/storytold/")})
          if bad:
              print("Git dependencies outside github.com/storytold:", *bad, sep="\n")
              sys.exit(1)
          PY

  gate:
    needs: changes
    # `changes` runs only on pushes; a skipped or failed `changes` leaves the gate as it was.
    if: >-
      !cancelled()
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    # Pinned: a mutable reference to another repository can change what CI runs. Move it deliberately.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@88148a57ef09ef407d73c0f385e04cc7f4c2720a # main, 25 November 2026
    with:
      # Windows on main (unless the push is docs-only), manual runs and pull requests labelled
      # `full-ci`. No macOS on PRs or main: the org's 5 macOS slots are kept for release builds,
      # and release.yml builds macOS.
      os: ${{ (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && needs.changes.outputs.docs_only != 'true' && '["ubuntu-24.04","windows-latest"]' || '["ubuntu-24.04"]' }}
      # Same craft-fonts commit as release.yml and freebsd.yml.
      craft-fonts-ref: &craft-fonts-ref b076417b5880bd4154bd22f00695b1d28c6bea83
      # egui/winit/rfd, and the independent oracles (crates/oracle). The coverage job reuses the list.
      packages: &linux-packages >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev qpdf poppler-utils
      # cargo-deny for the deny step of `cargo xtask ci`, which requires it under CI.
      tools: cargo-nextest@0.9.150,cargo-deny@0.20.2
      # A missing oracle fails the job instead of printing a skip notice that reads as a pass.
      linux-env: PDFCRAFT_ORACLES_REQUIRED=1
      windows-env: PDFCRAFT_REQUIRE_WINRES=1
      # Windows completed its 54m33s gate, then cache save hit the default 60m job cap
      # (run 44364342368). Leave bounded room for setup and post-job cleanup.
      # This changes no test watchdog or selection; craft-common-actions#60.
      timeout-minutes: 90
      # Windows checks what differs by platform: the build (with resources) and the tests.
      windows-command: |
        cargo clippy --workspace --all-targets --locked -- -D warnings
        cargo test --workspace --locked

  # The gate's tests run inside the pinned shared workflow, which keeps no report, so the Linux
  # tests run once more here under instrumentation for Codecov. Not part of the gate. It runs on
  # every pull request, so Codecov reports patch and project coverage before a merge, and on every
  # push to main that is not docs-only.
  coverage:
    needs: changes
    if: >-
      !cancelled() && needs.changes.outputs.docs_only != 'true'
      && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    name: Test coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_NET_RETRY: 10
      # Coverage comes from instrumentation, not DWARF; debuginfo is most of target/.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The gate builds with craft-fonts (and requires it); without them the tests that draw
      # Chinese text have no face for it.
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: *craft-fonts-ref
          path: craft-fonts
          persist-credentials: false
      # The gate builds with the translations at craft-i18n.rev (and requires them); without them
      # the tests that read a translated label have only English.
      - name: Check out craft-i18n
        uses: storytold/craft-common-actions/actions/checkout-craft-i18n@88148a57ef09ef407d73c0f385e04cc7f4c2720a # main, 25 November 2026
      # The instrumented workspace build overflows the free space on a stock runner.
      - name: Free disk space
        run: |
          nohup sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL </dev/null >/dev/null 2>&1 &
      - name: Install Linux build dependencies
        uses: storytold/craft-common-actions/actions/install-apt-packages@88148a57ef09ef407d73c0f385e04cc7f4c2720a # main, 25 November 2026
        with:
          packages: *linux-packages
      # The gate's toolchain: stable, as no rust-toolchain.toml names a channel.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component llvm-tools
          rustup default stable
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.150
          fallback: none
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Pull requests read main's cache and never write their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The tests `cargo xtask test` runs under nextest. vendor/ is left out, as in
      # sonar-project.properties. The 2 tests left out assert time bounds that instrumentation
      # breaks; the gate runs them. The sign test's bound is 20 s: 73 s here, 8 s uninstrumented.
      # The XFA prototype budget test's is 10 s: 10.2 and 10.6 s here, 0.9 s in the gate. XFA's
      # XML tree is its own code since the craft-pdf sync, so its accessors are instrumented, about
      # 128 million calls in that test; on main they were roxmltree's, which is not.
      - name: Run the tests with line coverage
        run: >
          cargo llvm-cov nextest --locked --workspace --lib --bins --tests --no-fail-fast
          --lcov --output-path coverage-rust.lcov --ignore-filename-regex '(^|/)vendor/'
          -E 'not (package(pdfcraft-sign) & test(=pdf::revision_classification_tests::shared_annotation_arrays_are_judged_in_bounded_time))
          and not (package(pdfcraft-xfa) & test(=proto::tests::prototype_children_that_write_nothing_still_count_against_a_budget))'
      - name: Keep the coverage report for the Codecov upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-rust
          path: coverage-rust.lcov
          retention-days: 1

  # The upload runs apart from the tests so the OIDC token is never available while test code
  # runs. A Codecov outage must not block merges. `changes` is skipped on pull requests, and a
  # skipped job upstream skips this one unless the condition names the coverage result. A fork's
  # pull request gets no OIDC token, so it is left out.
  codecov:
    name: upload coverage to Codecov
    needs: coverage
    if: >-
      !cancelled() && needs.coverage.result == 'success'
      && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage shows on this job but must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-rust
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-rust.lcov
          disable_search: true
          fail_ci_if_error: true
