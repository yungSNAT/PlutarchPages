# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

# Pushes to main take the pull request's paths (PATCHES.md): each run writes a cache of about
# 3 GB keyed on the commit, which kept the repository over its 10 GB cache limit. The weekly run
# catches FreeBSD breakage from changes outside those paths.
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  schedule:
    - cron: "23 5 * * 3" # weekly
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  # Only pull request runs are cancelled: scheduled and push runs on main would
  # otherwise cancel each other.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  freebsd:
    # Pinned: a mutable reference to another repository can change what CI runs. Move it deliberately.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@2b3fb9dc05036f73c77d18f753a3aa9da55fa386 # main, 31 October 2026
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
